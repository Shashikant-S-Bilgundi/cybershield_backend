# ShieldOps on one domain: the frontend and the API share an origin, so the
# session cookie stays first-party and no CORS is needed.
# Replace shieldops.example.com and the certificate paths.

server {
  listen 443 ssl http2;
  server_name shieldops.example.com;

  ssl_certificate     /etc/letsencrypt/live/shieldops.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shieldops.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  client_max_body_size 1m;

  # API
  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Telemetry from your apps (SDKs). Key-authenticated; larger bodies than the console.
  location /ingest/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 512k;
  }

  # Frontend build (npm run build in the frontend, then copy dist/ here)
  root /var/www/shieldops;
  index index.html;
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

server {
  listen 80;
  server_name shieldops.example.com;
  return 301 https://$host$request_uri;
}